name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Weekly run against the same config, to catch the world moving under us. An
  # unpinned dependency going incompatible upstream reddens CI on whatever commit
  # happens to land next — which is how mcp 2.0.0 broke this repo on a commit that
  # touched none of it. A schedule makes that a dated signal on main instead of a
  # false accusation against an unrelated change. (GitHub disables cron on a repo
  # with no activity for 60 days; a manual run re-arms it.)
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Cancel an in-flight run when a new commit is pushed to the same ref. The event
# name is in the group so a Monday cron cannot cancel an in-flight push run on
# main (and be read as that commit failing) — the exact confusion this file's
# scheduled run exists to prevent.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full-coverage matrix on Linux: install every optional extra (mcp + rasterio)
  # so the importorskip-guarded suites (test_server, test_local_dem) actually run.
  test-linux:
    name: test (ubuntu, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with all extras
        # Editable install so the pyproject entry points land on PATH and the
        # launcher tests (which `which hike-finder`) exercise the wrappers instead
        # of skipping. local-dem pulls rasterio (manylinux wheels, no system GDAL).
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,local-dem]"

      - name: Run test suite
        run: python -m pytest -q

  # Cross-platform smoke on the OS this project is developed on. rasterio is
  # omitted (heavier to wheel on Windows); test_local_dem skips cleanly. pwsh is
  # preinstalled on the runner, so the native .ps1 launchers are exercised here.
  test-windows:
    name: test (windows, py3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -q

  # Lint and type-check. PINNED, unlike the matrix above, and that asymmetry is the
  # point: the test jobs float so the Monday cron catches the world moving under us
  # (which is how mcp 2.0.0 broke this repo on a commit that touched none of it),
  # while a lint job that picked up new tool versions on their schedule would redden
  # CI on changes that touched none of THAT. A new ruff rule, or a third-party
  # annotation that changed shape, is not a defect in the commit being tested. Bump
  # these on purpose, in their own commit, with the findings fixed in the same one.
  #
  # The extras are installed because mypy reads them: without `mcp` the whole of
  # server.py types as Any, which is where 21 of the original 61 errors lived.
  # `pydantic` is pinned separately and deliberately — `mcp` only asks for `>=2`, and
  # it is pydantic's typing of the `Tool` model (field name vs wire alias) that nine
  # of those errors came from. Left floating, a pydantic minor could redden this job
  # on a commit that touched none of it, which is what the pinning is here to prevent.
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned tools and the dependencies mypy reads
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.15.17 mypy==2.3.0
          python -m pip install -e "." mcp==2.0.0 pydantic==2.13.4 \
            rasterio==1.5.0 requests==2.34.2

      # Config for both lives in pyproject.toml: rule set and line length under
      # [tool.ruff], scope and the 3.10 floor under [tool.mypy].
      - name: ruff
        run: ruff check src tests

      - name: mypy
        run: mypy
