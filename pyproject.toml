[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hike-finder-mcp"
version = "0.7.0"
description = "OSM-based hike search (CLI, web UI, and MCP server) with real computed elevation gain and distance"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Boyko Neov", email = "boikoneov@gmail.com" }]
keywords = ["hiking", "openstreetmap", "osm", "elevation", "gpx", "mcp", "overpass"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Environment :: Console",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = ["requests>=2.31"]

[project.urls]
Homepage = "https://github.com/BoykoNeov/hike-finder-mcp"
Repository = "https://github.com/BoykoNeov/hike-finder-mcp"
Changelog = "https://github.com/BoykoNeov/hike-finder-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# mcp >=2 only. server.py registers its handlers through the 2.x `Server` constructor
# (`on_list_tools` / `on_call_tool`); the 1.x decorators it used before are gone, and
# supporting both would mean a version branch in the server AND in the test harness —
# two code paths, one of which nobody runs. Floor, not cap: the 0.3.1 `<2` pin was a
# stopgap while the port was outstanding.
mcp = ["mcp>=2"]
local-dem = ["rasterio>=1.3"]
dev = ["pytest>=8.0", "mcp>=2"]

[project.scripts]
hike-finder = "hike_finder.cli:main"
hike-finder-web = "hike_finder.web:main"
hike-finder-mcp = "hike_finder.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Ruff. Selected over the default set because the extra families each caught something
# real on the first run (`zip` without `strict`, unsorted imports, collapsible ifs);
# line length is 100 rather than 88 because 11 354 of the 11 618 source lines already
# fit under 88 and only 69 exceeded 100 — an 88 limit would have meant rewrapping 859
# lines of prose to no one's benefit.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# BLE and SLF are in the set because the tree already carries `noqa: BLE001` and
# `noqa: SLF001` comments: someone reached for those rules before anything enforced
# them. Leaving them unselected would make RUF100 call those comments dead and delete
# the reasoning in them.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "BLE", "SLF"]
ignore = [
    # Ambiguous-unicode. This project is about walking in Europe: Špindlerův Mlýn,
    # Cortina d'Ampezzo and the ×/– in the design notes are the intended characters,
    # not homoglyph typos. Every one of the 18 findings was a real place name or a
    # typographic dash in a comment.
    "RUF001",
    "RUF002",
    "RUF003",
    # needless-bool. Its one site is the pair of gain bounds in `Criteria.accepts_gain`,
    # which are deliberately spelled identically; folding the second into
    # `return not (...)` makes two halves of one rule read as two different rules.
    "SIM103",
]

[tool.ruff.lint.per-file-ignores]
# `web.py` is two thirds one string: `INDEX_HTML`, the whole browser page (HTML, CSS and
# JavaScript) as a module constant. Every long line in the file lives in there, and
# rewrapping another language's markup to Python's column limit costs readability in that
# language to buy nothing in this one. The file's actual Python was wrapped by hand and is
# under the limit; if the page is ever extracted to its own module or a static file, drop
# this entry and the rule comes back for good.
"src/hike_finder/web.py" = ["E501"]
# A test that pins a private helper's behaviour is doing its job — the alternative is
# promoting internals to the public surface just to test them. The rule stays on for
# `src`, where reaching into another module's privates is a design smell.
"tests/*" = ["SLF001"]
