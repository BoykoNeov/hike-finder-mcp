[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hike-finder-mcp"
version = "0.3.1"
description = "OSM-based hike search (CLI, web UI, and MCP server) with real computed elevation gain and distance"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Boyko Neov", email = "boikoneov@gmail.com" }]
keywords = ["hiking", "openstreetmap", "osm", "elevation", "gpx", "mcp", "overpass"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Environment :: Console",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = ["requests>=2.31"]

[project.urls]
Homepage = "https://github.com/BoykoNeov/hike-finder-mcp"
Repository = "https://github.com/BoykoNeov/hike-finder-mcp"
Changelog = "https://github.com/BoykoNeov/hike-finder-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# mcp >=2 only. server.py registers its handlers through the 2.x `Server` constructor
# (`on_list_tools` / `on_call_tool`); the 1.x decorators it used before are gone, and
# supporting both would mean a version branch in the server AND in the test harness —
# two code paths, one of which nobody runs. Floor, not cap: the 0.3.1 `<2` pin was a
# stopgap while the port was outstanding.
mcp = ["mcp>=2"]
local-dem = ["rasterio>=1.3"]
dev = ["pytest>=8.0", "mcp>=2"]

[project.scripts]
hike-finder = "hike_finder.cli:main"
hike-finder-web = "hike_finder.web:main"
hike-finder-mcp = "hike_finder.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
